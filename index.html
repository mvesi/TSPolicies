            min-height: 100vh;

            flex-direction: column;

            align-items: center;
            padding: 20px;

            text-align: center;

            margin-left: auto;

            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-link {
            display: block;
            padding: 14px;
            color: #4ed9b7;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(78, 217, 183, 0.3);
            border-radius: 6px;
            transition: all 0.25s ease;
            background: transparent;
        }
        .nav-link:hover {
            background-color: #4ed9b7;
            color: #0b132b;
            border-color: #4ed9b7;
            box-shadow: 0 0 15px rgba(78, 217, 183, 0.4);
            transform: translateY(-2px);
        }
        .nav-link:active {
            transform: translateY(0);
        }
